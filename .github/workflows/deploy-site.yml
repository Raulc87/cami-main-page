# Uploads the site (a tagged main commit) to GoDaddy's public_html/ over FTPS (CMP-093, ADR-010).
#
# - Started by hand only (workflow_dispatch), from main only. Never on a push, merge or schedule.
# - The jobs wait for the owner's approval on the `site-production` GitHub environment before they
#   build with the production address or touch the server (the environment's required reviewer
#   applies to dry runs too). Two jobs use it (build, then upload), so the owner approves twice.
# - mode `build`: builds the tag, checks the bundle, uploads it, then attaches the built site as a
#   zip to the tag's GitHub Release (a third job; if it fails, re-run just that job).
#   mode `rollback`: uploads the zip kept on that tag's Release, unchanged, without building.
# - dry_run (default on): does everything up to the plan, uploads and deletes nothing.
#
# Environment secrets of `site-production` (never repository secrets; the owner types them in):
#   VITE_EVENTS_API_URL  the production events /exec address (public in the live bundle, kept out of the repo and logs)
#   STAGING_EVENTS_ID    the id inside the staging /exec address: the bundle must not contain it
#   FTP_HOST, FTP_USER, FTP_PASSWORD  a cPanel FTP account limited to public_html (host name only)
# Separate jobs keep the third-party build code away from the credentials: the build job runs the
# site's npm dependencies with only the events address and a read-only token; the upload job never
# runs them (it unzips the build, checks it again and uploads) and holds the FTP secrets; only the
# last job has a write token. The FTP login reaches curl through a config file removed afterwards.
# Third-party code: the pinned actions below, and curl/zip/gh from the runner image.
#
# Prerequisite for a build: the tag exists, is on main, and has a GitHub Release (the kept build is
# attached to it). Walk-through: the CMP-093 pull request; steps in docs/process/release-checklist.md §4.
name: Deploy site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v1.1.1)
        type: string
        required: true
      mode:
        description: build = build the tag and upload it; rollback = upload the kept build of that tag
        type: choice
        options: [build, rollback]
        default: build
      dry_run:
        description: Dry run (check and list what would change, upload nothing)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build:
    # Only the main branch may deploy (the environment also allows only main).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: site-production
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
          echo "Deploying $TAG, mode $MODE, dry run ${{ inputs.dry_run }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is on main and has a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" > /dev/null || { echo "::error::Tag $TAG does not exist."; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main || { echo "::error::Tag $TAG is not on main: only a reviewed main commit may go live."; exit 1; }
          gh release view "$TAG" > /dev/null || { echo "::error::Tag $TAG has no GitHub Release; create it first (the kept build is attached to it)."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.mode == 'build'
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: site-src
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.mode == 'build'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site-src/package-lock.json

      # The only step that runs the site's npm dependencies. It sees the events address and
      # nothing else secret, and the job's token can only read.
      - name: Build the tag
        if: inputs.mode == 'build'
        working-directory: site-src
        env:
          VITE_EVENTS_API_URL: ${{ secrets.VITE_EVENTS_API_URL }}
        run: |
          [ -n "$VITE_EVENTS_API_URL" ] || { echo "::error::VITE_EVENTS_API_URL is missing in the site-production environment."; exit 1; }
          npm ci --ignore-scripts
          npm run build
          (cd dist && zip -q -X -r "$RUNNER_TEMP/site-$TAG.zip" .)

      - name: Take the kept build of the tag
        if: inputs.mode == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "site-$TAG.zip" --dir "$RUNNER_TEMP"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: ${{ runner.temp }}/site-${{ inputs.tag }}.zip
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    runs-on: ubuntu-latest
    environment: site-production
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The scripts come from main (this workflow's own commit), never from the tag; this job runs
      # none of the site's dependencies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: ${{ runner.temp }}/artifact

      - name: Unpack the build
        run: unzip -q "$RUNNER_TEMP/artifact/site-$TAG.zip" -d site-dist

      - name: Check the bundle
        env:
          VITE_EVENTS_API_URL: ${{ secrets.VITE_EVENTS_API_URL }}
          STAGING_EVENTS_ID: ${{ secrets.STAGING_EVENTS_ID }}
        run: node .github/scripts/site-bundle-check.mjs site-dist

      - name: Upload (or dry run)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_DIR: site-dist
          DRY_RUN: ${{ inputs.dry_run }}
        run: .github/scripts/site-upload.sh

  keep-build:
    # After a real upload of a built tag: attach the exact files to the tag's Release. No secrets, no
    # environment; the only job with a write token. If it fails, re-run just this job (the artifact
    # stays for 7 days), or run the workflow again in build mode.
    if: inputs.mode == 'build' && inputs.dry_run == false
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: ${{ runner.temp }}/artifact

      - name: Keep the build on the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/artifact/site-$TAG.zip" --clobber --repo "$GITHUB_REPOSITORY"
