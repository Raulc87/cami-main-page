# Syntax check of the events backend on pull requests (CMP-047). No secrets, read-only token.
name: Apps Script check

on:
  pull_request:
    paths:
      - 'apps-script/**'
      - '.github/scripts/**'
      - '.github/clasp/**'
      - '.github/workflows/deploy-apps-script.yml'
      - '.github/workflows/apps-script-check.yml'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Syntax of every script file
        run: |
          status=0
          for f in apps-script/*.js .github/scripts/*.mjs; do
            node --check "$f" || status=1
          done
          for f in .github/scripts/*.sh; do
            bash -n "$f" || status=1
          done
          exit $status

      - name: appsscript.json is valid JSON and keeps the web app settings
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("apps-script/appsscript.json", "utf8"));
            if (m.runtimeVersion !== "V8") throw new Error("runtimeVersion must be V8");
            if (!m.webapp || m.webapp.executeAs !== "USER_DEPLOYING" || m.webapp.access !== "ANYONE_ANONYMOUS") throw new Error("webapp settings changed");
          '
